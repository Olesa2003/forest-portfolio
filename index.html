<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заявки на материалы для занятий</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #faf7ed;
      color: #26382c;
      --ink: #26382c;
      --muted: #586357;
      --line: #e5e1d2;
      --green: #2b684d;
      --green-dark: #1a513a;
      --surface: #fffdf8;
      --sun: #ffedae;
      --display-face: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background-image: radial-gradient(#deceb2 1px, transparent 1px);
      background-size: 23px 23px;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid #326b8a; outline-offset: 3px; }
    [hidden] { display: none !important; }

    .container { width: min(1120px, calc(100% - 64px)); margin-inline: auto; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
    .topbar .container { display: flex; align-items: center; justify-content: space-between; min-height: 66px; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display-face); font-size: 1.125rem; font-weight: 700; }
    .brand-mark {
      position: relative; width: 40px; height: 40px; border-radius: 13px;
      background: #ffedb4; flex: none;
    }
    .brand-mark::before, .brand-mark::after {
      content: ""; position: absolute; width: 12px; height: 12px; border-radius: 3px;
    }
    .brand-mark::before { left: 14px; top: 6px; background: #cf665a; transform: rotate(-10deg); }
    .brand-mark::after { left: 7px; top: 21px; background: #3683a1; box-shadow: 14px 0 #4d8b56; }
    .demo { font-size: .875rem; font-weight: 650; color: #345847; background: #e7f2df; border-radius: 20px; padding: 6px 12px; text-align: center; }

    main.container { padding-block: 27px 50px; }
    .intro {
      display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
      overflow: hidden; border-radius: 26px; background: var(--sun);
      border: 1px solid #e8d99f; box-shadow: 0 10px 24px #5f452315;
    }
    .intro-copy { padding: 34px clamp(24px, 3.5vw, 48px); align-self: center; }
    .playmat {
      position: relative; min-height: 264px;
      background: #d3e9a9;
    }
    .playmat img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 56% center; }
    .playmat::after {
      content: ""; position: absolute; inset: 0 auto 0 -1px; width: 13px;
      background: radial-gradient(circle at 0 50%, var(--sun) 11px, transparent 12px) 0 0 / 13px 24px repeat-y;
    }
    h1, h2, h3, p { margin: 0; }
    h1, h2 { font-family: var(--display-face); }
    h1 { max-width: 12ch; font-size: clamp(2.05rem, 5vw, 3.65rem); line-height: 1.01; letter-spacing: -.055em; }
    .intro p { color: #4a5640; margin-top: 13px; max-width: 31ch; line-height: 1.45; }

    .layout { display: grid; grid-template-columns: minmax(280px, .82fr) minmax(0, 1.35fr); align-items: start; gap: 22px; margin-top: 24px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 24px; box-shadow: 0 8px 25px #674f2510; }
    h2 { font-size: 1.36rem; line-height: 1.24; letter-spacing: -.025em; }
    .panel-title { display: flex; align-items: center; gap: 10px; }
    .panel-title::before {
      content: ""; flex: 0 0 30px; height: 30px; border-radius: 10px;
      background-repeat: no-repeat;
    }
    #new-title::before {
      background: linear-gradient(#893d31, #893d31) center / 12px 2px no-repeat,
        linear-gradient(#893d31, #893d31) center / 2px 12px no-repeat #f9decf;
    }
    #journal-title::before {
      background: linear-gradient(#236581, #236581) center 10px / 12px 2px no-repeat,
        linear-gradient(#236581, #236581) center 14px / 12px 2px no-repeat,
        linear-gradient(#236581, #236581) center 18px / 8px 2px no-repeat #e1edf4;
    }
    form { display: grid; gap: 17px; margin-top: 21px; }
    .fields { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 12px; align-items: end; }
    .field { min-width: 0; }
    label { display: block; font-size: .875rem; font-weight: 650; margin-bottom: 7px; }
    label span { color: var(--muted); font-weight: 400; }
    input, select, textarea {
      width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid #cccdbb;
      border-radius: 12px; color: var(--ink); background: #fffefa;
    }
    input::placeholder, textarea::placeholder { color: #5d7167; opacity: 1; }
    select {
      appearance: none; padding-right: 32px; text-overflow: ellipsis;
      background-image: linear-gradient(45deg, transparent 50%, #4f6458 50%), linear-gradient(135deg, #4f6458 50%, transparent 50%);
      background-position: right 15px center, right 10px center;
      background-size: 5px 5px; background-repeat: no-repeat;
    }
    textarea { min-height: 66px; resize: vertical; }
    .primary {
      border: 1px solid transparent; border-radius: 12px; min-height: 46px;
      padding: 10px 14px; color: #fff; background: var(--green); font-weight: 650;
    }
    .primary:hover { background: var(--green-dark); }
    .notice { margin-top: 14px; font-size: .875rem; line-height: 1.4; color: var(--green-dark); }
    .notice:empty { margin-top: 0; }
    .notice[data-warning="true"] { color: #8a3e1c; }

    .journal-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
    .summary { color: var(--muted); font-size: .875rem; }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px; background: #f1eee3; border-radius: 12px; width: fit-content; margin-block: 17px 12px; }
    .filter { border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 7px 10px; color: #40564d; font-size: .875rem; font-weight: 650; min-height: 36px; }
    .filter[aria-pressed="true"] { background: #fff; border-color: #e4dfcd; color: var(--ink); box-shadow: 0 1px 2px #40371c12; }
    .filter:hover { color: var(--green-dark); }
    .requests { display: grid; gap: 10px; list-style: none; margin: 0; padding: 0; }
    .request {
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center;
      padding: 15px; border: 1px solid var(--line); border-radius: 14px; background: #fff;
    }
    .request h3 { font-size: 1rem; line-height: 1.3; overflow-wrap: anywhere; }
    .request-meta, .request-note { color: var(--muted); font-size: .875rem; line-height: 1.45; overflow-wrap: anywhere; }
    .request-meta { margin-top: 4px; }
    .request-note { margin-top: 6px; white-space: pre-wrap; }
    .request-controls { display: flex; align-items: flex-end; flex-direction: column; gap: 7px; }
    .state { width: fit-content; border-radius: 20px; padding: 4px 9px; font-size: .8125rem; font-weight: 650; white-space: nowrap; }
    .state.open { background: #ffedb6; color: #684a08; }
    .state.done { background: #e1f2db; color: #275b37; }
    .request-action {
      background: #fff; border: 1px solid #c6d9cc; border-radius: 10px; min-height: 36px; padding: 6px 10px;
      color: var(--green-dark); font-size: .875rem; font-weight: 650;
    }
    .request-action:hover { background: #f0f8f0; }
    .empty { padding: 25px 12px; text-align: center; color: var(--muted); border: 1px dashed #bdcec4; border-radius: 11px; line-height: 1.5; }

    @media (max-width: 740px) {
      .container { width: calc(100% - 32px); }
      .layout { grid-template-columns: 1fr; gap: 16px; margin-top: 16px; }
      .intro { grid-template-columns: 1fr; border-radius: 22px; }
      .intro-copy { padding: 23px 21px; }
      h1 { max-width: none; }
      .playmat { min-height: 0; aspect-ratio: 2.6; }
      .playmat::after {
        inset: -1px 0 auto; width: auto; height: 13px;
        background: radial-gradient(circle at 50% 0, var(--sun) 11px, transparent 12px) 0 0 / 24px 13px repeat-x;
      }
      main.container { padding-block: 22px 36px; }
    }
    @media (max-width: 425px) {
      .topbar .container { min-height: 62px; }
      .brand { gap: 8px; font-size: 1rem; }
      .panel { padding: 17px; }
      .request { grid-template-columns: 1fr; gap: 10px; }
      .request-controls { flex-direction: row; align-items: center; flex-wrap: wrap; }
      .filters { gap: 2px; }
      .filter { padding-inline: 8px; }
    }
  </style>
</head>
<body>

    <div class="container">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Детский сад</div>
      <span class="demo">Учебный прототип</span>
    </div>
  </header>
  <main class="container">

      <section class="panel" aria-labelledby="journal-title">
        <div class="journal-heading">
          <h2 id="journal-title" class="panel-title">Журнал заявок</h2>
          <p id="summary" class="summary"></p>
        </div>
        <div class="filters" id="filters" role="group" aria-label="Фильтр по статусу">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">Все</button>
          <button class="filter" type="button" data-filter="open" aria-pressed="false">Открытые</button>
          <button class="filter" type="button" data-filter="done" aria-pressed="false">Выполненные</button>
        </div>
        <p class="empty" id="empty" hidden></p>
        <ul class="requests" id="requests" aria-label="Заявки на материалы"></ul>
      </section>
    </div>
  </main>
  <template id="request-template">
    <li class="request">
      <div>
        <h3></h3>
        <p class="request-meta"></p>
        <p class="request-note" hidden></p>
      </div>
      <div class="request-controls">
        <span class="state"></span>
        <button type="button" class="request-action"></button>
      </div>
    </li>
  </template>
  <script>
    "use strict";

    const storageKey = "kindergarten-material-requests-v1";
    const form = document.querySelector("#request-form");
    const list = document.querySelector("#requests");
    const template = document.querySelector("#request-template");
    const filters = document.querySelector("#filters");
    const summary = document.querySelector("#summary");
    const empty = document.querySelector("#empty");
    const feedback = document.querySelector("#feedback");
    const storageWarning = document.querySelector("#storage-warning");
    const dateFormat = new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "short", year: "numeric" });
    const initialRequests = [
      { id: "sample-3", material: "Цветной картон", quantity: 10, unit: "лист.", group: "Старшая группа", note: "Для аппликаций. Формат А4.", done: false },
      { id: "sample-2", material: "Кисти для рисования", quantity: 6, unit: "шт.", group: "Средняя группа", note: "Круглые кисти.", done: false },
      { id: "sample-1", material: "Пластилин", quantity: 4, unit: "наб.", group: "Младшая группа", note: "", done: true }
    ];
    const emptyMessages = {
      all: "Заявок пока нет. Добавьте первую через форму.",
      open: "Открытых заявок нет.",
      done: "Выполненных заявок пока нет."
    };
    let activeFilter = "all";
    let requests = initialRequests;
    let canPersist = true;

    function readRequests() {
      if (!canPersist) return requests;
      try {
        const saved = localStorage.getItem(storageKey);
        if (saved === null) return initialRequests;
        const data = JSON.parse(saved);
        if (!Array.isArray(data)) throw new Error("Invalid stored requests");
        return data;
      } catch {
        canPersist = false;
        storageWarning.hidden = false;
        return requests;
      }
    }

    function saveRequests(next) {
      requests = next;
      if (!canPersist) return;
      try {
        localStorage.setItem(storageKey, JSON.stringify(next));
      } catch {
        canPersist = false;
        storageWarning.hidden = false;
      }
    }

    function makeCard(request) {
      const card = template.content.firstElementChild.cloneNode(true);
      card.querySelector("h3").textContent = request.material;
      const meta = [request.group, request.quantity + " " + (request.unit ?? "ед.")];
      if (request.created) meta.push(dateFormat.format(request.created));
      else meta.push("Пример");
      card.querySelector(".request-meta").textContent = meta.join(" · ");
      const note = card.querySelector(".request-note");
      note.textContent = request.note;
      note.hidden = !request.note;
      const state = card.querySelector(".state");
      state.textContent = request.done ? "Выполнена" : "Открыта";
      state.classList.add(request.done ? "done" : "open");
      const button = card.querySelector(".request-action");
      button.dataset.id = request.id;
      button.textContent = request.done ? "Вернуть в открытые" : "Отметить выполненной";
      button.setAttribute("aria-label", button.textContent + " — " + request.material);
      return card;
    }

    function render() {
      const visible = requests.filter(request => activeFilter === "all" || request.done === (activeFilter === "done"));
      list.replaceChildren(...visible.map(makeCard));
      empty.textContent = emptyMessages[activeFilter];
      empty.hidden = visible.length > 0;
      const completed = requests.filter(request => request.done).length;
      summary.textContent = "Всего " + requests.length + " · Открыто " + (requests.length - completed);
      for (const button of filters.querySelectorAll("button")) {
        button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter));
      }
    }

    form.elements.material.addEventListener("input", event => event.target.setCustomValidity(""));
    form.addEventListener("submit", event => {
      event.preventDefault();
      const data = new FormData(form);
      const material = String(data.get("material")).trim();
      if (!material) {
        form.elements.material.setCustomValidity("Укажите название материала.");
        form.elements.material.reportValidity();
        return;
      }
      const request = {
        id: globalThis.crypto?.randomUUID?.() ?? String(Date.now()) + "-" + Math.random().toString(36).slice(2),
        group: data.get("group"),
        material,
        quantity: Number(data.get("quantity")),
        unit: data.get("unit"),
        note: String(data.get("note")).trim(),
        created: Date.now(),
        done: false
      };
      saveRequests([request, ...readRequests()]);
      activeFilter = "open";
      form.reset();
      render();
      feedback.textContent = "Заявка добавлена в журнал.";
    });

    filters.addEventListener("click", event => {
      const button = event.target.closest("button[data-filter]");
      if (!button) return;
      activeFilter = button.dataset.filter;
      render();
    });

    list.addEventListener("click", event => {
      const button = event.target.closest("button[data-id]");
      if (!button) return;
      const current = readRequests();
      const selected = current.find(request => request.id === button.dataset.id);
      if (!selected) return;
      saveRequests(current.map(request => request === selected ? { ...request, done: !request.done } : request));
      render();
      const sameButton = [...list.querySelectorAll("button")].find(item => item.dataset.id === selected.id);
      (sameButton ?? filters.querySelector('[aria-pressed="true"]')).focus();
      feedback.textContent = selected.done ? "Заявка снова открыта." : "Заявка выполнена.";
    });

    window.addEventListener("storage", event => {
      if (event.key !== storageKey && event.key !== null) return;
      requests = readRequests();
      render();
    });

    requests = readRequests();
    render();
  </script>
</body>
</html>
